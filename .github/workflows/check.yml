name: Check artshow

on:
  push:
    branches: [mainframe, "feat/**"]
  pull_request:
    branches: [mainframe]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run deploy -- --dry-run
